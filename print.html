<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم الطباعة والفليكس | المصري ديزاين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; overflow-x: hidden; }
        .container { width: min(92%, 1200px); margin: 0 auto; }
        
        header { background: #ffffff; box-shadow: 0 4px 20px rgba(0,0,0,0.05); padding: 15px 0; }
        .header-container { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: clamp(20px, 2.5vw, 24px); font-weight: 900; color: #0f172a; display: flex; align-items: center; gap: 8px; }
        .logo i { color: #0284c7; }
        .back-btn { text-decoration: none; color: #0284c7; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; }

        .page-header { padding: 35px 0 15px; text-align: center; }
        .page-header h1 { font-size: clamp(24px, 3.5vw, 36px); color: #0f172a; font-weight: 900; }

        .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; padding-bottom: 60px; }
        .card { 
            background: white; border-radius: 20px; overflow: hidden; border: 1px solid #e2e8f0; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.04); display: flex; flex-direction: column; justify-content: space-between; 
            transition: 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(2, 132, 199, 0.1); }
        .card-img { width: 100%; height: clamp(180px, 20vw, 230px); object-fit: cover; }
        .card-content { padding: 20px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        .card h3 { font-size: clamp(16px, 1.8vw, 19px); color: #0f172a; margin-bottom: 15px; font-weight: 700; }
        
        .btn-inquire {
            background: #25d366; color: white; padding: 10px; border-radius: 12px;
            text-align: center; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; cursor: pointer; width: 100%; font-size: 14px; transition: 0.3s;
        }
        .btn-inquire:hover { background: #1eb854; }
    </style>
</head>
<body>

    <header>
        <div class="container header-container">
            <div class="logo"><i class="fa-solid fa-scroll"></i> <span>المصري ديزاين</span></div>
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</a>
        </div>
    </header>

    <div class="container page-header">
        <h1>قسم الطباعة والفليكس</h1>
    </div>

    <div class="container">
        <div class="grid-cards">

            <div class="card">
                <img src="قسم الطباعة/5947300129297601700_121.jpg" alt="فليكس مضيء" class="card-img">
                <div class="card-content">
                    <h3>فليكس مضيء</h3>
                    <button onclick="inquire('فليكس مضيء')" class="btn-inquire"><i class="fa-brands fa-whatsapp"></i> تواصل للاستفسار</button>
                </div>
            </div>

            <div class="card">
                <img src="قسم الطباعة/5947300129297601701_121.jpg" alt="قارمة محل" class="card-img">
                <div class="card-content">
                    <h3>قارمة محل</h3>
                    <button onclick="inquire('قارمة محل')" class="btn-inquire"><i class="fa-brands fa-whatsapp"></i> تواصل للاستفسار</button>
                </div>
            </div>

            <div class="card">
                <img src="قسم الطباعة/5947300129297601702_121.jpg" alt="لوحة دعائية فليكس" class="card-img">
                <div class="card-content">
                    <h3>لوحة دعائية فليكس</h3>
                    <button onclick="inquire('لوحة دعائية فليكس')" class="btn-inquire"><i class="fa-brands fa-whatsapp"></i> تواصل للاستفسار</button>
                </div>
            </div>

            <div class="card">
                <img src="قسم الطباعة/5947300129297601703_121.jpg" alt="فينيل لاصق" class="card-img">
                <div class="card-content">
                    <h3>فينيل لاصق</h3>
                    <button onclick="inquire('فينيل لاصق')" class="btn-inquire"><i class="fa-brands fa-whatsapp"></i> تواصل للاستفسار</button>
                </div>
            </div>

            <div class="card">
                <img src="قسم الطباعة/5947300129297601690_121.jpg" alt="فينيل مثقب" class="card-img">
                <div class="card-content">
                    <h3>فينيل مثقب</h3>
                    <button onclick="inquire('فينيل مثقب')" class="btn-inquire"><i class="fa-brands fa-whatsapp"></i> تواصل للاستفسار</button>
                </div>
            </div>

            <div class="card">
                <img src="قسم الطباعة/5947300129297601691_121.jpg" alt="فليكس غير مضيء" class="card-img">
                <div class="card-content">
                    <h3>فليكس غير مضيء</h3>
                    <button onclick="inquire('فليكس غير مضيء')" class="btn-inquire"><i class="fa-brands fa-whatsapp"></i> تواصل للاستفسار</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        function inquire(itemName) {
            const phone = "963969892591";
            const message = `السلام عليكم ورحمة الله وبركاته، أريد الاستفسار عن ${itemName}`;
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
        }
    </script>

</body>
</html>
