<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم الألكبوند | المصري ديزاين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; }
        .container { width: 90%; max-width: 1200px; margin: 0 auto; }
        
        header { background: #ffffff; box-shadow: 0 4px 20px rgba(0,0,0,0.05); padding: 18px 0; }
        .header-container { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 900; color: #0f172a; }
        .back-btn { text-decoration: none; color: #0284c7; font-weight: 700; }

        .page-header { padding: 40px 0; text-align: center; }
        .page-header h1 { font-size: 36px; color: #0f172a; font-weight: 900; }

        .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; padding-bottom: 60px; }
        .card { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.04); display: flex; flex-direction: column; justify-content: space-between; }
        .card-img { width: 100%; height: 230px; object-fit: cover; }
        .card-content { padding: 20px; text-align: center; }
        .card h3 { font-size: 20px; color: #0f172a; margin-bottom: 15px; }
        
        .btn-inquire {
            background: #25d366; color: white; padding: 12px; border-radius: 12px;
            text-align: center; font-weight: 700; text-decoration: none; display: block; border: none; cursor: pointer; width: 100%;
        }
        .btn-inquire:hover { background: #1eb854; }
    </style>
</head>
<body>

    <header>
        <div class="container header-container">
            <div class="logo">المصري ديزاين</div>
            <a href="index.html" class="back-btn">← العودة للرئيسية</a>
        </div>
    </header>

    <div class="container page-header">
        <h1>قسم الألكبوند</h1>
    </div>

    <div class="container">
        <div class="grid-cards">

            <div class="card">
                <img src="قسم الالكبوند/5947300129297601687_119.jpg" alt="مكتب الشهباء" class="card-img">
                <div class="card-content">
                    <h3>مكتب الشهباء</h3>
                    <button onclick="inquire('أعمال ألكبوند - مكتب الشهباء')" class="btn-inquire">تواصل للاستفسار</button>
                </div>
            </div>

            <div class="card">
                <img src="قسم الالكبوند/5947300129297601688_119.jpg" alt="إعمار بلدنا" class="card-img">
                <div class="card-content">
                    <h3>إعمار بلدنا</h3>
                    <button onclick="inquire('أعمال ألكبوند - إعمار بلدنا')" class="btn-inquire">تواصل للاستفسار</button>
                </div>
            </div>

            <div class="card">
                <img src="قسم الالكبوند/5947300129297601694_119.jpg" alt="كلية العلوم الصحية" class="card-img">
                <div class="card-content">
                    <h3>كلية العلوم الصحية</h3>
                    <button onclick="inquire('أعمال ألكبوند - كلية العلوم الصحية')" class="btn-inquire">تواصل للاستفسار</button>
                </div>
            </div>

            <div class="card">
                <img src="قسم الالكبوند/5947300129297601695_119.jpg" alt="مطعم بيسترو" class="card-img">
                <div class="card-content">
                    <h3>مطعم بيسترو</h3>
                    <button onclick="inquire('أعمال ألكبوند - مطعم بيسترو')" class="btn-inquire">تواصل للاستفسار</button>
                </div>
            </div>

            <div class="card">
                <img src="قسم الالكبوند/5947300129297601697_119.jpg" alt="مجموعة الأهرام العقارية" class="card-img">
                <div class="card-content">
                    <h3>مجموعة الأهرام العقارية</h3>
                    <button onclick="inquire('أعمال ألكبوند - مجموعة الأهرام العقارية')" class="btn-inquire">تواصل للاستفسار</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        function inquire(itemName) {
            const phone = "963969892591";
            const message = `السلام عليكم ورحمة الله وبركاته، أريد الاستفسار عن ${itemName}`;
            const whatsappURL = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(whatsappURL, '_blank');
        }
    </script>

</body>
</html>
